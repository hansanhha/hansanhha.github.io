<!DOCTYPE html>
<html lang="ko">
<head>
	<link rel="stylesheet" href="/assets/default.css">
	<link rel="stylesheet" href="/assets/path.css">
	<link rel="stylesheet" href="/assets/lang.css">
	{% include meta.html %}
	{% include theme.html %}
</head>
<body>
	<div class="main-container">
		{% include path.html %}
		<main class="main-content">
			{% if page.date != nil %}
				<div class="post-date"> {{ page.date }} </div>
			{% endif %}
			{% if page.content != nil and page.content != "" %}
				{{ content }}
				{% include go-to-top.html %}
			{% else %}
				<span id="empty"></span>
			{% endif %}
		</main>
	</div>
</body>
{% include index-box.html %}
<script>
	const $empty = document.getElementById("empty");

	if ($empty != undefined) {
        if (localStorage.getItem("lang") === "한글") {
            $empty.textContent = "빈 페이지";
        } else {
            $empty.textContent = "empty page";
        }
    }

	const $aList = Array.from(document.getElementsByTagName("a"));

	const isKorean = localStorage.getItem("lang") === "한글";
	$aList.forEach($a => {
		if (isKorean) {
			if ($a.dataset.displayKo != undefined) {
				$a.textContent = $a.dataset.displayKo;
			}
			if ($a.dataset.hrefKo != undefined) {
				$a.href = $a.dataset.hrefKo;
			}
		} else if ($a.dataset.display != undefined){
			$a.textContent = $a.dataset.display;
		} else {
			$a.textContent = $a.textContent;
		}
	});
</script>
</html>
