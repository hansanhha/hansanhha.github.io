	<link rel="stylesheet" href="/assets/item.css">
	<link rel="stylesheet" href="/assets/default.css">
	<link rel="stylesheet" href="/assets/path.css">
	<link rel="stylesheet" href="/assets/lang.css">
	{% include meta.html %}
    {% include theme.html %}

<body>
    <div class="common-wrapper">
        {% include blog-search.html %}
        <div style="display: flex; flex-direction: column;">
            {% include common.html %}
			{% if page.content != nil and page.content != "" %}
                <div id="page-content-wrapper">
                    <!--<div class="image-view-selector">
                        <span id="view"></span>
                        <span id="single"></span>
                        <span id="multi"></span>
                    </div>-->
                    <div id="image-container">
                        {{ content }}
                    </div>
                </div>
                {% include go-to-top.html %}
            {% else %}
                <span id="empty"></span>
            {% endif %}
            {% include footer.html %}
        </div>
    </div>
</body>
{% include default-script.html %}
<script>
const originalImgs = [];

document.addEventListener("DOMContentLoaded", function() {
    const $empty = document.getElementById("empty");
    if ($empty != undefined) {
        if (localStorage.getItem("lang") === "ko") {
            $empty.textContent = "빈 페이지";
        } else {
            $empty.textContent = "empty page";
        }
        return;
    }

    const $imageContainer = document.getElementById("image-container");
    const images = Array.from($imageContainer.querySelectorAll("img"));
    images.forEach(img => {
        originalImgs.push(img);
        img.addEventListener("click", () => focus(img));

        function limitImageHeight() {
            const viewportHeight = window.innerHeight;
            const maxHeight = viewportHeight * 0.98;

            if (img.naturalHeight > viewportHeight) {
                img.style.maxHeight = maxHeight + "px";
                img.style.width = "auto";
            }
        }

        if (img.complete) {
            limitImageHeight();
        } else {
            img.addEventListener("load", limitImageHeight);
        }
    });

    //configureDisplayOptions();

    const $imageObjects = document.getElementById("images-objects");
    const $imageSeason = document.getElementById("images-season");
    const $imageFilm = document.getElementById("images-film");
    const $imageRoom = document.getElementById("images-room");
    const $imageWeeknd = document.getElementById("images-weeknd");
    const $imagePaintings = document.getElementById("images-paintings");

    const $imageObjectTextContent = document.createElement("div");
    const $imageSeasonTextContent = document.createElement("div");
    const $imageFilmTextContent = document.createElement("div");
    const $imageRoomTextContent = document.createElement("div");
    const $imageWeekndTextContent = document.createElement("div");
    const $imagePaintingsTextContent = document.createElement("div");

    if (localStorage.getItem("lang") === "ko") {
      $imageObjectTextContent.textContent = "사물";
      $imageSeasonTextContent.textContent = "계절";
      $imageFilmTextContent.textContent = "영화";
      $imageRoomTextContent.textContent = "공간";
      $imageWeekndTextContent.textContent = "위켄드";
      $imagePaintingsTextContent.textContent = "미술";
    } else {
      $imageObjectTextContent.textContent = "Objects";
      $imageSeasonTextContent.textContent = "Season";
      $imageFilmTextContent.textContent = "Film";
      $imageRoomTextContent.textContent = "Room";
      $imageWeekndTextContent.textContent = "The Weeknd";
      $imagePaintingsTextContent.textContent = "Art";
    }

    const imageTextContents = new Array();
    imageTextContents.push($imageObjectTextContent, $imageSeasonTextContent, $imageFilmTextContent, $imageRoomTextContent, $imageWeekndTextContent, $imagePaintingsTextContent);
    imageTextContents.forEach(($imageTextContent) => {
      $imageTextContent.style.fontSize = "20px";
    });

    $imageObjects.appendChild($imageObjectTextContent);
    $imageSeason.appendChild($imageSeasonTextContent);
    $imageFilm.appendChild($imageFilmTextContent);
    $imageRoom.appendChild($imageRoomTextContent);
    $imageWeeknd.appendChild($imageWeekndTextContent);
    $imagePaintings.appendChild($imagePaintingsTextContent);

    const imageTitles = new Array();
    imageTitles.push($imageObjects, $imageSeason, $imageFilm, $imageRoom, $imageWeeknd, $imagePaintings);
    imageTitles.forEach(($imageTitle) => {
        if (($imageTitle.textContent === "사물" || $imageTitle.textContent === "Objects")) {
            $imageTitle.style.marginTop = "8px";
        } else {
            $imageTitle.style.marginTop = "16px";
        }

        $imageTitle.style.display = "flex";
        $imageTitle.style.alignItems = "center";
        $imageTitle.style.gap = "7px";
        $imageTitle.style.marginBlockEnd = "0px";

        const $prevBtn = document.createElement("div");
        const $nextBtn = document.createElement("div");

        $prevBtn.textContent = "←";
        $nextBtn.textContent = "→";

        $prevBtn.classList.add("cursor-pointer");
        $nextBtn.classList.add("cursor-pointer");

        let $imageList;

        switch (true) {
            case ($imageTitle.textContent === "사물" || $imageTitle.textContent === "Objects"):
                $imageList = document.querySelector("#images-objects-list");
                break;
            case ($imageTitle.textContent === "계절" || $imageTitle.textContent === "Season"):
                $imageList = document.querySelector("#images-season-list");
                break;
            case ($imageTitle.textContent === "영화" || $imageTitle.textContent === "Film"):
                $imageList = document.querySelector("#images-film-list");
                break;
            case ($imageTitle.textContent === "공간" || $imageTitle.textContent === "Room"):
                $imageList = document.querySelector("#images-room-list");
                break;
            case ($imageTitle.textContent === "위켄드" || $imageTitle.textContent === "The Weeknd"):
                $imageList = document.querySelector("#images-weeknd-list");
                break;
            case ($imageTitle.textContent === "그림" || $imageTitle.textContent === "Paintings"):
                $imageList = document.querySelector("#images-paintings-list");
                break;
        }

        $prevBtn.addEventListener("click", (e) => {
            e.stopPropagation();

            if ($imageList.scrollLeft <= 0) {
                return;
            }

            const moveDistance = Math.min(
                $imageList.clientWidth,
                $imageList.scrollLeft
            );

            $imageList.scrollBy({
                left: -moveDistance,
                behavior: "smooth"
            });
        });

        $nextBtn.addEventListener("click", (e) => {
            e.stopPropagation();

            const maxScrollLeft = $imageList.scrollWidth - $imageList.clientWidth;
            if ($imageList.scrollLeft >= maxScrollLeft) {
                return;
            }

            const remainingDistance = maxScrollLeft - $imageList.scrollLeft;
            if (remainingDistance <= 0) {
                return;
            }

            $imageList.scrollBy({
                left: Math.min($imageList.clientWidth, remainingDistance),
                behavior: "smooth"
            });
        });

        $imageTitle.appendChild($prevBtn);
        $imageTitle.appendChild($nextBtn);
    });

    document.querySelectorAll(".images-list img").forEach(img => {
        if (window.innerWidth <= 960) {
          img.style.height = "450px";
          img.style.width = "auto";
          img.style.objectFit = "cover";
        } else {
          img.style.height = "700px";
          img.style.width = "auto";
        }
    });

});

function configureDisplayOptions() {
    const $view = document.getElementById("view");
    const $single = document.getElementById("single");
    const $multi = document.getElementById("multi");
    const $imageContainer = document.getElementById("image-container");

    $single.classList.add("selected-highlight", "cursor-pointer");
    $multi.classList.add("cursor-pointer");
    if (localStorage.getItem("lang") === "ko") {
        $view.textContent = "표시: ";
        $single.textContent = "단일";
        $multi.textContent = "다중";
    } else {
        $view.textContent = "View: ";
        $single.textContent = "Single";
        $multi.textContent = "Multi";
    }

    $single.addEventListener("click", () => {
        $single.classList.add("selected-highlight", "cursor-pointer");
        $multi.classList = "cursor-pointer";
        const images = Array.from($imageContainer.querySelectorAll("img"));
        $imageContainer.innerHTML = "";

        originalImgs.forEach(img => {
            const $imgBox = document.createElement("p");
            $imgBox.appendChild(img);
            $imageContainer.appendChild($imgBox);
        });
    });

    $multi.addEventListener("click", () => {
        $multi.classList.add("selected-highlight", "cursor-pointer");
        $single.classList = "cursor-pointer";
        const $imageContainer = document.getElementById("image-container");
        const containerWidth = $imageContainer.clientWidth;
        const images = Array.from($imageContainer.querySelectorAll("img"));
        const imgCount = images.length;
        const rows = [];
        let currentRow = [];
        let currentRowWidth = 0;
        const isMobile = window.matchMedia('(max-width: 960px)').matches;

        for (const img of images) {
            const aspectRatio = img.naturalWidth / img.naturalHeight;
            const expectedWidth = isMobile ? aspectRatio * 100 : aspectRatio * 300;
            if (currentRowWidth + expectedWidth >= containerWidth && currentRow.length > 0) {
                rows.push(currentRow);
                currentRow = [];
                currentRowWidth = 0;
            }
            currentRow.push({img, aspectRatio});
            currentRowWidth += expectedWidth;
        }

        if (currentRow.length > 0) rows.push(currentRow);

        $imageContainer.innerHTML = "";

        rows.forEach(row => {
            const $row = document.createElement("div");
            $row.classList.add("image-row");

            const totalAspect = row.reduce((sum, {aspectRatio}) => sum + aspectRatio, 0);

            row.forEach(({img, aspectRatio}) => {
                const $imgBox = document.createElement("p");
                const cloned = img.cloneNode();
                $imgBox.addEventListener("click", () => focus(originalImgs.filter(i => i.src === img.src)[0]));
                $imgBox.style.maxWidth = isMobile ? `${(aspectRatio / totalAspect) * 94}%` : `${(aspectRatio / totalAspect) * 97.7}%`;
                $imgBox.appendChild(cloned);
                $row.appendChild($imgBox);
            });

            $imageContainer.appendChild($row);
        });
    });
}
