<!DOCTYPE html>
<html lang="ko">
<head>
	<link rel="stylesheet" href="/assets/item.css">
	<link rel="stylesheet" href="/assets/default.css">
	<link rel="stylesheet" href="/assets/path.css">
	<link rel="stylesheet" href="/assets/lang.css">
	{% include meta.html %}
    {% include theme.html %}
</head>
<body>
    <div style="display: flex; flex-direction: column; margin-top: 5px; padding-left: 10px; gap: 10px;">
        {% include blog-search.html %}
        <div style="display: flex; flex-direction: column;">
            {% include common.html %}
			{% if page.content != nil and page.content != "" %}
                <div id="page-content-wrapper">
                    <!--<div class="image-view-selector">
                        <span id="view"></span>
                        <span id="single"></span>
                        <span id="multi"></span>
                    </div>-->
                    <div id="image-container">
                        {{ content }}
                    </div>
                </div>
                {% include go-to-top.html %}
            {% else %}
                <span id="empty"></span>
            {% endif %}
            {% include footer.html %}
        </div>
    </div>
</body>
{% include default-script.html %}
<script>
const originalImgs = [];

document.addEventListener("DOMContentLoaded", function() {
    const $empty = document.getElementById("empty");
    if ($empty != undefined) {
        if (localStorage.getItem("lang") === "ko") {
            $empty.textContent = "빈 페이지";
        } else {
            $empty.textContent = "empty page";
        }
        return;
    }

    const $imageContainer = document.getElementById("image-container");
    const images = Array.from($imageContainer.querySelectorAll("img"));
    images.forEach(img => {
        originalImgs.push(img);
        img.addEventListener("click", () => focus(img));

        function limitImageHeight() {
            const viewportHeight = window.innerHeight;
            const maxHeight = viewportHeight * 0.98;

            if (img.naturalHeight > viewportHeight) {
                img.style.maxHeight = maxHeight + "px";
                img.style.width = "auto";
            }
        }

        if (img.complete) {
            limitImageHeight();
        } else {
            img.addEventListener("load", limitImageHeight);
        }
    });

    //configureDisplayOptions();

    const $imagesOjbect = document.getElementById("images-objects");
    const $imagesSeason = document.getElementById("images-season");
    const $imagesFilm = document.getElementById("images-film");
    const $imagesRoom = document.getElementById("images-room");
    const $imagesWeeknd = document.getElementById("images-weeknd");
    const $imagesPaintings = document.getElementById("images-paintings");

    $imagesOjbect.style.fontSize = "1.5rem";
    $imagesSeason.style.fontSize = "1.5rem";
    $imagesFilm.style.fontSize = "1.5rem";
    $imagesRoom.style.fontSize = "1.5rem";
    $imagesWeeknd.style.fontSize = "1.5rem";
    $imagesPaintings.style.fontSize = "1.5rem";

    $imagesSeason.style.marginTop = "50px";
    $imagesFilm.style.marginTop = "50px";
    $imagesRoom.style.marginTop = "50px";
    $imagesWeeknd.style.marginTop = "50px";
    $imagesPaintings.style.marginTop = "50px";

    if (localStorage.getItem("lang") === "ko") {
      $imagesOjbect.textContent = "사물";
      $imagesSeason.textContent = "계절";
      $imagesFilm.textContent = "영화";
      $imagesRoom.textContent = "공간";
      $imagesWeeknd.textContent = "위켄드";
      $imagesPaintings.textContent = "그림";
    } else {
      $imagesOjbect.textContent = "Objects";
      $imagesSeason.textContent = "Season";
      $imagesFilm.textContent = "Film";
      $imagesRoom.textContent = "Room";
      $imagesWeeknd.textContent = "The Weeknd";
      $imagesPaintings.textContent = "Paintings";
    }

    document.querySelectorAll(".images-list img").forEach(img => {
        if (window.innerWidth <= 768) {
          img.style.height = "350px";
          img.style.width = "auto";
        } else {
          img.style.height = "700px";
          img.style.width = "auto";
        }
    });

});

function configureDisplayOptions() {
    const $view = document.getElementById("view");
    const $single = document.getElementById("single");
    const $multi = document.getElementById("multi");
    const $imageContainer = document.getElementById("image-container");

    $single.classList.add("selected-highlight", "cursor-pointer");
    $multi.classList.add("cursor-pointer");
    if (localStorage.getItem("lang") === "ko") {
        $view.textContent = "표시: ";
        $single.textContent = "단일";
        $multi.textContent = "다중";
    } else {
        $view.textContent = "View: ";
        $single.textContent = "Single";
        $multi.textContent = "Multi";
    }

    $single.addEventListener("click", () => {
        $single.classList.add("selected-highlight", "cursor-pointer");
        $multi.classList = "cursor-pointer";
        const images = Array.from($imageContainer.querySelectorAll("img"));
        $imageContainer.innerHTML = "";

        originalImgs.forEach(img => {
            const $imgBox = document.createElement("p");
            $imgBox.appendChild(img);
            $imageContainer.appendChild($imgBox);
        });
    });

    $multi.addEventListener("click", () => {
        $multi.classList.add("selected-highlight", "cursor-pointer");
        $single.classList = "cursor-pointer";
        const $imageContainer = document.getElementById("image-container");
        const containerWidth = $imageContainer.clientWidth;
        const images = Array.from($imageContainer.querySelectorAll("img"));
        const imgCount = images.length;
        const rows = [];
        let currentRow = [];
        let currentRowWidth = 0;
        const isMobile = window.matchMedia('(max-width: 768px)').matches;

        for (const img of images) {
            const aspectRatio = img.naturalWidth / img.naturalHeight;
            const expectedWidth = isMobile ? aspectRatio * 100 : aspectRatio * 300;
            if (currentRowWidth + expectedWidth >= containerWidth && currentRow.length > 0) {
                rows.push(currentRow);
                currentRow = [];
                currentRowWidth = 0;
            }
            currentRow.push({img, aspectRatio});
            currentRowWidth += expectedWidth;
        }

        if (currentRow.length > 0) rows.push(currentRow);

        $imageContainer.innerHTML = "";

        rows.forEach(row => {
            const $row = document.createElement("div");
            $row.classList.add("image-row");

            const totalAspect = row.reduce((sum, {aspectRatio}) => sum + aspectRatio, 0);

            row.forEach(({img, aspectRatio}) => {
                const $imgBox = document.createElement("p");
                const cloned = img.cloneNode();
                $imgBox.addEventListener("click", () => focus(originalImgs.filter(i => i.src === img.src)[0]));
                $imgBox.style.maxWidth = isMobile ? `${(aspectRatio / totalAspect) * 94}%` : `${(aspectRatio / totalAspect) * 97.7}%`;
                $imgBox.appendChild(cloned);
                $row.appendChild($imgBox);
            });

            $imageContainer.appendChild($row);
        });
    });
}

function focus($img) {
    const $overlay = document.createElement("div");
    Object.assign($overlay.style, {
        position: "fixed",
        maxWidth: "100vw",
        maxHeight: "100vh",
        display: "flex",
        inset: "0",
        alignItems: "center",
        justifyContent: "center",
        background: "rgba(0,0,0,0.7)",
        backdropFilter: "blur(2px)",
        WebkitBackdropFilter: "blur(2px)",
        zIndex: "9999",
        cursor: "normal",
        overflow: "hidden",
        padding: window.innerWidth <= 768 ? "10px" : "40px",
        opacity: "0",
        transition: "opacity 250ms ease",
    });

    const $imgBox = document.createElement("div");
    Object.assign($imgBox.style, {
        width: "100%",
        height: "100%",
        display: "flex",
        alignItems: "start",
        justifyContent: "center",
        overflow: "hidden",
    });

    const $focusedImg = $img.cloneNode(true);
    Object.assign($focusedImg.style, {
        width: "auto",
        height: "auto",
        maxWidth: ($img.dataset.desc || $img.dataset.descKo) ? window.innerWidth <= 768 ? "100%" : "65%" : "100%",
        maxHeight: "100%",
        objectFit: "contain",
        alignItems: "center",
        cursor: "normal",
        flexShrink: 0,
        opacity: "0",
        transform: "scale(0.92)",
        transition: "opacity 250ms ease, transform 250ms ease",
    });

    if (window.innerWidth <= 768) {
        $imgBox.style.flexDirection = "column";
        $imgBox.style.justifyContent = ($img.dataset.desc || $img.dataset.descKo) ? "start" : "center";

        $focusedImg.style.width = "auto";
        $focusedImg.style.height = "auto";
        $focusedImg.style.maxWidth = "100%";
        $focusedImg.style.maxHeight = "65%";
        $focusedImg.style.objectFit = "contain";
    }

    const $imgDescriptionBox = document.createElement("div");
    Object.assign($imgDescriptionBox.style, {
        display: "flex",
        flexDirection: "column",
        gap: "0.5em",
        overflowY: "auto",
        overflowX: "hidden",
        scrollbarWidth: "none",
        alignItems: "start",
        fontSize: "17px",
        color: "#e3dfdf",
        opacity: "0",
        transform: window.innerWidth <= 768
            ? "translateY(0px)"
            : "translateX(0px)",
        transition: "opacity .3s ease, transform .3s cubic-bezier(.22,.61,.36,1)",
    });

    const style = document.createElement("style");
    style.textContent = `
        .img-desc-box::-webkit-scrollbar { display: none; width: 0; height: 0; }
    `;
    document.head.appendChild(style);
    $imgDescriptionBox.className = "img-desc-box";

    if (window.innerWidth <= 768) {
        Object.assign($imgDescriptionBox.style, {
            maxWidth: "98%",
            maxHeight: "100%",
            marginTop: "20px",
            paddingRight: "10px",
        });
    } else {
        Object.assign($imgDescriptionBox.style, {
            maxWidth: "35%",
            maxHeight: "100%",
            marginLeft: "30px",
            paddingRight: "10px",
        });
    }

    if ($img.dataset.desc || $img.dataset.descKo) {
        let descriptions;
        if (localStorage.getItem("lang") === "ko") {
            descriptions = ($img.dataset.descKo || $img.dataset.desc).split(" ");
        } else {
            descriptions = ($img.dataset.desc || $img.dataset.descKo).split(" ");
        }

        const nextLineIdxs = [];
        let index = descriptions.indexOf("\\n");

        while (index !== -1) {
            nextLineIdxs.push(index);
            index = descriptions.indexOf("\\n", index + 1);
        }

        if (nextLineIdxs.length === 0) {
            const $desc = document.createElement("div");
            descriptions.forEach(d => {
                $desc.textContent += (d + " ");
            });
            $imgDescriptionBox.appendChild($desc);
        } else {
            let start = 0;
            for (let i = 0; i < nextLineIdxs.length; i++) {
                const $desc = document.createElement("div");
                const idx = nextLineIdxs[i];
                const slices = descriptions.slice(start, idx);
                slices.forEach(s => {
                    $desc.textContent += (s + " ");
                });
                start = idx + 1;
                $imgDescriptionBox.appendChild($desc);
            }
            const slices = descriptions.slice(start);
            const $desc = document.createElement("div");
            slices.forEach(s => {
                $desc.textContent += (s + " ");
            });
            $imgDescriptionBox.appendChild($desc);
        }
    }

    function close() {
        $overlay.style.opacity = "0";

        $focusedImg.style.opacity = "0";
        $focusedImg.style.transform = "scale(.96)";

        $imgDescriptionBox.style.opacity = "0";
        $imgDescriptionBox.style.transform = window.innerWidth <= 768
            ? "translateY(0px)"
            : "translateX(0px)";

        setTimeout(() => {
            if ($overlay.parentNode) {
                $overlay.parentNode.removeChild($overlay);
            }
            document.body.style.overflow = "";
            document.removeEventListener("keydown", onKey);
        }, 300);
    }
    function onKey(e) {
        if (e.key === "Escape") close();
    }

    $focusedImg.addEventListener("click", close);
    $overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);

    $imgBox.appendChild($focusedImg);
    $imgBox.appendChild($imgDescriptionBox);
    $overlay.appendChild($imgBox);
    document.body.appendChild($overlay);
    requestAnimationFrame(() => {
        $overlay.style.opacity = "1";

        $focusedImg.style.opacity = "1";
        $focusedImg.style.transform = "scale(1)";

        setTimeout(() => {
            $imgDescriptionBox.style.opacity = "1";
            $imgDescriptionBox.style.transform = "translateX(0)";
            if (window.innerWidth <= 768) {
                $imgDescriptionBox.style.transform = "translateY(0)";
            }
        }, 40);
    });

    document.body.style.overflow = "hidden";
}
</script>
</html>
