<script>
if (!document.getElementById("not-found")) {
  localStorage.setItem("updateLang", "false");
}

init();

function init() {
  handleEmptyContent();

  if (!localStorage.getItem("layout")) renderSimpleLayout();
  if (localStorage.getItem("layout") === "verbose") renderVerboseLayout();
  else renderSimpleLayout();
}

function handleEmptyContent() {
  const $empty = document.getElementById("empty");
  const $pageContentWrapper = document.getElementById("page-content-wrapper");
  const $mainContent = document.getElementsByClassName("main-content");
  if ($empty) {
      $empty.textContent = localStorage.getItem("lang") === "ko" ? "빈 페이지" : "Empty Page";
  } else if (window.location.pathname !== "/" && $pageContentWrapper && $pageContentWrapper.childElementCount === 0) {
      const $span = document.createElement("div");
      $span.style.marginBottom = "3px";
      $span.textContent = localStorage.getItem("lang") === "ko" ? "빈 페이지" : "Empty Page";
      $pageContentWrapper.innerHTML = "";
      $pageContentWrapper.appendChild($span);
  } else if ($mainContent && $mainContent[0] && $mainContent[0].childElementCount === 0) {
      const $span = document.createElement("div");
      $span.textContent = localStorage.getItem("lang") === "ko" ? "빈 페이지" : "Empty Page";
      $mainContent[0].innerHTML = "";
      $mainContent[0].appendChild($span);
  }
}

  if ($idxPathsBox) $idxPathsBox.remove(); 

  setBlogDefaultConfigs();
  configHTMLElements();
  fetchBlogInfo();
  notFoundInSimpleLayout();
  const title = getPageTitle();
  printBlogInfoInSimpleLayout(title);
  setGoToTop();
}

          $pageInfoGuide.innerText = "";

  $idxDescriptionBox.appendChild($currentIdx);

function setGoToTop() {
  const $goToTopBox = document.getElementById("go-to-top-box");
  const $goToTop = document.getElementById("go-to-top");
  
  if ($goToTopBox && $goToTop && location.pathname !== "/") {
    if (localStorage.getItem("layout") === "simple") {
      $goToTopBox.style.fontSize = "24px";
      $goToTopBox.style.fontWeight = "500";
      $goToTop.classList.add("hover-font-weight-800");
    }
    window.addEventListener("load", () => {
        if (document.documentElement.scrollHeight > window.innerHeight) {
            $goToTopBox.style.display = "block";
            $goToTop.textContent = localStorage.getItem("lang") === "ko" ? "위로 가기 ↑ " : "go to top ↑";
        } else {
            $goToTopBox.style.display = "none";
        }
    });

    $goToTopBox.addEventListener("click", () => {
        if (location.hash) {
            history.replaceState(null, '', location.pathname + location.search);
        }
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });

    window.addEventListener("resize", toggleGoToTopByResizing);
  }
}

async function fetchBlogInfo() {
    if (localStorage.getItem("layout") && localStorage.getItem("layout") === "verbose") {
      try {
          await loadScript(
              "https://cdn.jsdelivr.net/npm/ua-parser-js@2.0.10/dist/ua-parser.pack.min.js",
              5000
          );

          const parser = new UAParser();
          const result = parser.getResult();

          if (localStorage.getItem("lang") === "en") {
            document.getElementById("user_agent").innerText = "User-Agent: " + result.device.vendor + " " + result.os.name + ", " + result.browser.name;
          } else {
            const convertedResult = convertToKoreanUserAgent(result);
            document.getElementById("user_agent").innerText = "접속 환경: " + convertedResult.device.vendor + " " + convertedResult.os.name + ", " + convertedResult.browser.name
          }
      } catch (error) {
        if (localStorage.getItem("lang") === "en") {
          document.getElementById("user_agent").innerText = "User-Agent: Checking Failed";
        } else {
          document.getElementById("user_agent").innerText = "접속 환경: 알 수 없음";
        }
      }
    }

    if (location.pathname === "/projects/blog" || location.pathname === "/projects/blog.html") {
      const $blogUpdateInfo = document.getElementById("blog-update-info");
      if ($blogUpdateInfo) {
          try {
            $blogUpdateInfo.textContent = localStorage.getItem("lang") === "ko" 
                ? "정보를 가져오는 중"
                : "Fetching the information";
              
              const response = await fetchAPI(
                  "https://api.github.com/repos/hansanhha/hansanhha.github.io/commits?sha=blog",
                  {},
                  5000
              );

              const data = await response.json();
              const lastCommitDate = data[0].commit.committer.date;
              const formattedDate = formatToLongDate(lastCommitDate);
              $blogUpdateInfo.textContent = formattedDate;
              localStorage.setItem("lastUpdateDate", formattedDate);
          } catch (error) {
              if (localStorage.getItem("lastUpdateDate")) $blogUpdateInfo.textContent = localStorage.getItem("lastUpdateDate");
              else {
                if (localStorage.getItem("lang") === "en") $blogUpdateInfo.textContent = "알 수 없음";
                else $blogUpdateInfo.textContent = "Unknown";
              }
          }
      }
    }
}

function loadScript(src, timeout = 5000) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        const timer = setTimeout(() => {
            script.remove();
            reject(new Error(`Script load timeout: ${src}`));
        }, timeout);

        script.src = src;
        script.async = true;

        script.onload = () => {
            clearTimeout(timer);
            resolve();
        };

        script.onerror = () => {
            clearTimeout(timer);
            script.remove();
            reject(new Error(`Script load failed: ${src}`));
        };

        document.head.appendChild(script);
    });
}

async function fetchAPI(url, options = {}, timeout = 5000) {
    const controller = new AbortController();

    const timer = setTimeout(() => {
        controller.abort();
    }, timeout);

    try {
        const response = await fetch(url, {
            ...options,
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error(
                `Fetch failed: ${response.status} ${response.statusText}`
            );
        }

        return response;
    } catch (error) {
        if (error.name === "AbortError") {
            throw new Error(`Fetch timeout: ${url}`);
        }

        throw error;
    } finally {
        clearTimeout(timer);
    }
}

function setBlogDefaultConfigs() {
  if (!localStorage.getItem("lang") || localStorage.getItem("lang") === "korean" || localStorage.getItem("lang") === "한글") {
    localStorage.setItem("lang", "ko");
  } else if ((!localStorage.getItem("lang") && (navigator.language.startsWith("en")) || localStorage.getItem("lang") === "english")) {
      localStorage.setItem("lang", "en");
  }

  if (!localStorage.getItem("layout")) localStorage.setItem("layout", "simple");

  const fontSize = localStorage.getItem("fontSize");
  const contentLineHeight = localStorage.getItem("content-line-height");
  if (fontSize) {
      if (document.getElementById("page-content-wrapper")) document.getElementById("page-content-wrapper").style.fontSize = `${fontSize}px`;
      if (document.getElementById("page-info-title")) document.getElementById("page-info-title").style.fontSize = `${fontSize}px`;
      if (document.getElementsByClassName("idx-container").length > 0) document.getElementsByClassName("idx-container")[0].style.fontSize = `${fontSize}px`;
  }
  if (contentLineHeight) {
      document.documentElement.style.setProperty("--main-content-p", contentLineHeight+"px");
  }

  if (localStorage.getItem("theme")) {
    if (localStorage.getItem("theme") === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.setAttribute("data-theme", "dark");
  } else {
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.setAttribute("data-theme", "light");
  }

  const userPreferTheme = window.matchMedia("(prefers-color-scheme: dark)");
  userPreferTheme.addEventListener?.("change", (e) => {
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const $root = document.documentElement;

      if (prefersDark) {
          localStorage.setItem("theme", "dark");
          $root.setAttribute("data-theme", "dark");
          printDarkTheme();
          location.reload();
          return;
      }

      localStorage.setItem("theme", "light");
      $root.setAttribute("data-theme", "light");
      printLightTheme();
      location.reload();
  });

  if (location.pathname.includes("/projects/")) {
    const $projectStartDate = document.getElementById("project-start-date");
    if ($projectStartDate && $projectStartDate.innerText) {
      $projectStartDate.innerText = formatToLongDate($projectStartDate.innerText);
    }
  }
}

function getPageTitle() {
  const $title = document.querySelector("title");
  if (localStorage.getItem("lang") === "en" && $title.dataset.pageTitle) {
    return capitalize(String($title.dataset.pageTitle));
  } else if (localStorage.getItem("lang") === "ko" && $title.dataset.pageTitleKo) {
    return capitalize($title.dataset.pageTitleKo);
  } else if (localStorage.getItem("lang") === "en" && $title.dataset.pageName) {
    return capitalize(String($title.dataset.pageName));
  } else if (localStorage.getItem("lang") === "ko" && $title.dataset.pageNameKo){
    return $title.dataset.pageNameKo;
  } else if ($title.dataset.pageDefaultTitle) {
    return $title.dataset.pageDefaultTitle;
  } else {
    return document.title;
  }
}

function changeFontSize(delta) {
    const $idxContainer = document.getElementsByClassName("idx-container");
    const $pageContentWrapper = document.getElementById("page-content-wrapper");
    const $pageInfoTitle = document.getElementById("page-info-title");
    const root = document.documentElement;
    const mainContentP = getComputedStyle(root).getPropertyValue("--main-content-p");
    const currentFontSize = parseFloat(getComputedStyle($pageContentWrapper).fontSize);
    
    let newMainContentP = parseInt(mainContentP.slice(0, -2))+parseInt(delta);
    if (delta === 0) {
      newMainContentP = 24;
    }
    localStorage.setItem("content-line-height", newMainContentP);
    document.documentElement.style.setProperty("--main-content-p", newMainContentP+"px");

    let newFontSize = currentFontSize + delta;
    if (delta === 0) newFontSize = 16;

    localStorage.setItem("fontSize", newFontSize);
    $pageContentWrapper.style.fontSize = `${newFontSize}px`;
    if ($idxContainer) $idxContainer[0].style.fontSize = `${newFontSize}px`;
    if ($pageInfoTitle) $pageInfoTitle.style.fontSize = `${newFontSize}px`;
}

const autoIndexesMenu = ["projects", "code", "daily"];
function changeLang(lang) {
    if (lang === "en") {
        if (localStorage.getItem("lang") === "en") return;

        localStorage.setItem("lang", "en");
        localStorage.setItem("updateLang", "true");
        if (window.location.href === window.location.origin + "/") {
          location.reload();
          return;
        }

        originHref = window.location.href;
        if (autoIndexesMenu.some(menu => originHref.includes(menu)))  {
          const lastIdx = originHref.lastIndexOf("/");
          location.href = originHref.substring(0, lastIdx) + "/en/" + originHref.substring(lastIdx + 1);
        } else {
          location.reload();
        }
    } else {
      if (localStorage.getItem("lang") === "ko") return;

      localStorage.setItem("lang", "ko");
      localStorage.setItem("updateLang", "true");
      if (window.location.href === window.location.origin + "/") {
        location.reload();
        return;
      }

      originHref = window.location.href;
      if (autoIndexesMenu.some(menu => originHref.includes(menu))) {
        const lastIdx = originHref.lastIndexOf("/en/");
        if (lastIdx === -1) {
          location.reload();
        } else {
          location.href = originHref.substring(0, lastIdx) + "/" + originHref.substring(lastIdx + 4);
        }
      } else {
        location.reload();
      }
    }
}

function convertToKoreanUserAgent(userAgent) {
    let vendor = "", os = "", browser = "";
    let deviceType = "";

    if (userAgent.device.vendor) {
      vendor = userAgent.device.vendor.toLocaleLowerCase();
    }
    if (userAgent.os.name) {
      os = userAgent.os.name.toLocaleLowerCase();
    }
    if (userAgent.browser.name) {
      browser = userAgent.browser.name.toLocaleLowerCase();
    }
    if (userAgent.device.type) {
      deviceType = userAgent.device.type.toLocaleLowerCase();
    }

    const koreanUserAgent = {
      device: {
        vendor: vendor,
      },
      os : {
        name: os,
      },
      browser: {
        name: browser,
      },
    }

    if (deviceType === "tablet") {
      koreanUserAgent.device.vendor = convertDeviceNameToKorean(vendor);
      koreanUserAgent.os.name = convertDeviceNameToKorean(vendor);
    } else {
      koreanUserAgent.device.vendor = convertDeviceNameToKorean(vendor);
      koreanUserAgent.os.name = convertDeviceNameToKorean(os);
    }
    koreanUserAgent.browser.name = convertDeviceNameToKorean(browser);    

    return koreanUserAgent;
}

async function search(searchQuery, moveOnToSearchPage) {
    if (!searchQuery) searchQuery = document.getElementById("input_search").value.trim().toLowerCase();
    if (!searchQuery) return;

    try {
        const response = await fetch("/search.json");
        const textData = await response.text();
        const jsonData = JSON.parse(textData);
        printSearchResult(searchQuery, jsonData);
        toggleGoToTopByResizing();
        const q = searchQuery;
        if (!moveOnToSearchPage) {
          history.pushState(
            null,
            "",
            `/?search=${encodeURIComponent(q)}`
          );
        }
    } catch (error) {
        printErrorResult();
    } 
}

function printPosts($searchResultBox, locale, options, posts, category, subcategory) {
  const $category = document.createElement("div");
  $category.style.marginTop = "12px";
  $category.classList = "post-list";
  const $categoryTextContent = document.createElement("span");
  if (subcategory) {
    $category.id = category + "-" + subcategory;
    $categoryTextContent.textContent = capitalize(localize(category) + " " + localize(subcategory));
  } else {
    $category.id = category;
    $categoryTextContent.textContent = capitalize(localize(category));
  }
  $categoryTextContent.style.fontWeight = 400;
  $category.appendChild($categoryTextContent);
  $searchResultBox.appendChild($category);

  const groupedPosts = Object.groupBy(posts, post => post["group"]);
  if (Object.keys(groupedPosts).length > 1) {
    const defaultGroup = groupedPosts["default"];
    if (defaultGroup) {
      const $group = document.createElement("div");
      const groupedPosts = organizeGroup(defaultGroup, $group, locale, options, true);
      $category.appendChild(groupedPosts);
    }
    delete groupedPosts["default"];

    const nullGroup = groupedPosts["null"];
    if (nullGroup) {
      const $group = document.createElement("div");
      const $groupName = document.createElement("div");

      let group = "기본";
      if (category == "daily") group = localStorage.getItem("lang") === "ko" ? "뒤돌아보고, 멈추고, 앞으로 가고" : "Looking Back, Stopping, Going Forward";
      $groupName.innerText = "- " + group;
      $groupName.classList.add("post-group-name");
      $group.appendChild($groupName);

      const subgroupedPosts = organizeGroup(groupedPosts["null"], $group, locale, options);
      $category.appendChild(subgroupedPosts);
    }
    delete groupedPosts["null"];

    for (const group of Object.keys(groupedPosts)) {
      const $group = document.createElement("div");
      const $groupName = document.createElement("div");

      $groupName.innerText = "- " + group;
      $groupName.classList.add("post-group-name");
      $group.appendChild($groupName);

      const subgroupedPosts = organizeGroup(groupedPosts[group], $group, locale, options);
      $category.appendChild(subgroupedPosts);
    }
  } else {
      for (const post of posts) {
        const $post = document.createElement("div");
        const postDate = post.createDate ? post.createDate : post.date;
        const formattedDate = new Date(postDate.replace(/-/g, '/')).toLocaleDateString(locale, options);
        const title = locale === "ko-KR" ? post.pagenameKo ? post.pagenameKo : post.pagename : post.pagename;
        const nonUndefinedTitle = title ? title : post.title;
        const capitalizedTitle = capitalize(nonUndefinedTitle);

        $post.innerHTML = `
            <span class='post-link'><a href="${post.url}">${capitalizedTitle}</a></span>
        `;
        $category.appendChild($post);
      }
  }
}

function organizeGroup(groupedPosts, $group, locale, options, defaultGroup) {
  const subGroupedPosts = Object.groupBy(groupedPosts, post => post["subgroup"]);
  
  let subGroupCount = 1;
  for (const indexKey of Object.keys(subGroupedPosts)) {
    const $subGroup = document.createElement("div");
    if (subGroupCount > 1) $subGroup.classList.add("post-subgroup");
    for (const post of subGroupedPosts[indexKey]) {
      let $post;
      if (defaultGroup) {
        $post = document.createElement("div");
        $post.style.marginBottom = "4px";
      } else {
        $post = document.createElement("p");
      }
      const postDate = post.createDate ? post.createDate : post.date;
      const formattedDate = new Date(postDate.replace(/-/g, '/')).toLocaleDateString(locale, options);
      const title = locale === "ko-KR" ? post.pagenameKo ? post.pagenameKo : post.pagename : post.pagename;
      const nonUndefinedTitle = title ? title : post.title;
      const capitalizedTitle = capitalize(nonUndefinedTitle);
      $post.innerHTML = `
            <span class='post-link'><a href="${post.url}">${capitalizedTitle}</a></span>
        `;
      $subGroup.appendChild($post);
    }
    $group.appendChild($subGroup);
    subGroupCount++;
  }

  return $group;
}

  return new Date(date).toLocaleDateString(locale, options);  
}

function localize(category) {
    if (localStorage.getItem("lang") !== "ko") return category;

    let localized;
    switch(category) {
        case "projects":
        localized = "프로젝트";
        break;

        case "walk":
        localized = "산책";
        break;

        case "code":
        localized = "프로그래밍";
        break;

        case "daily":
        localized = "일상";
        break;

        case "archives":
        localized = "아카이브";
        break;

        case "sunrise":
        localized = "해맞이";
        break;

        default:
        localized = category;
    }

    return localized
}

function capitalize(str) {
  return str
    .split(" ")
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(" ");
}

    const style = document.createElement("style");
    style.textContent = `
        .img-desc-box::-webkit-scrollbar { display: none; width: 0; height: 0; }
    `;
    document.head.appendChild(style);
    $imgDescriptionBox.className = "img-desc-box";

    if (window.innerWidth <= 960) {
        Object.assign($imgDescriptionBox.style, {
            maxWidth: "98%",
            maxHeight: "100%",
            marginTop: "8px",
            paddingRight: "10px",
        });
    } else {
        Object.assign($imgDescriptionBox.style, {
            maxWidth: "35%",
            maxHeight: "100%",
            marginLeft: "30px",
            paddingRight: "10px",
        });
    }

    if ($img.dataset.desc || $img.dataset.descKo) {
        let descriptions;
        if (localStorage.getItem("lang") === "ko") {
            descriptions = ($img.dataset.descKo || $img.dataset.desc).split(" ");
        } else {
            descriptions = ($img.dataset.desc || $img.dataset.descKo).split(" ");
        }

        const nextLineIdxs = [];
        let index = descriptions.indexOf("\\n");

        while (index !== -1) {
            nextLineIdxs.push(index);
            index = descriptions.indexOf("\\n", index + 1);
        }

        if (nextLineIdxs.length === 0) {
            const $desc = document.createElement("div");
            descriptions.forEach(d => {
                $desc.textContent += (d + " ");
            });
            $imgDescriptionBox.appendChild($desc);
        } else {
            let start = 0;
            for (let i = 0; i < nextLineIdxs.length; i++) {
                const $desc = document.createElement("div");
                const idx = nextLineIdxs[i];
                const slices = descriptions.slice(start, idx);
                slices.forEach(s => {
                    $desc.textContent += (s + " ");
                });
                start = idx + 1;
                $imgDescriptionBox.appendChild($desc);
            }
            const slices = descriptions.slice(start);
            const $desc = document.createElement("div");
            slices.forEach(s => {
                $desc.textContent += (s + " ");
            });
            $imgDescriptionBox.appendChild($desc);
        }
    }

    function close() {
        $overlay.style.opacity = "0";

        $focusedImg.style.opacity = "0";
        $focusedImg.style.transform = "scale(.96)";

        $imgDescriptionBox.style.opacity = "0";
        $imgDescriptionBox.style.transform = window.innerWidth <= 960
            ? "translateY(0px)"
            : "translateX(0px)";

        setTimeout(() => {
            if ($overlay.parentNode) {
                $overlay.parentNode.removeChild($overlay);
            }
            document.body.style.overflow = "";
            document.removeEventListener("keydown", onKey);
        }, 300);
    }
    function onKey(e) {
        if (e.key === "Escape") close();
    }

    $focusedImg.addEventListener("click", close);
    $overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);

    $imgBox.appendChild($focusedImg);
    $imgBox.appendChild($imgDescriptionBox);
    if (window.innerWidth > 960) {
        const setDescriptionHeight = () => {
            const imgHeight = $focusedImg.height;
            $imgDescriptionBox.style.height = `${imgHeight}px`;
        };
        if ($focusedImg.complete) {
            setDescriptionHeight();
        } else {
            $focusedImg.addEventListener("load", setDescriptionHeight, { once: true });
        }
    }
    $overlay.appendChild($imgBox);
    document.body.appendChild($overlay);
    requestAnimationFrame(() => {
        $overlay.style.opacity = "1";

        $focusedImg.style.opacity = "1";
        $focusedImg.style.transform = "scale(1)";

        setTimeout(() => {
            $imgDescriptionBox.style.opacity = "1";
            $imgDescriptionBox.style.transform = "translateX(0)";
            if (window.innerWidth <= 960) {
                $imgDescriptionBox.style.transform = "translateY(0)";
            }
        }, 40);
    });

    document.body.style.overflow = "hidden";
}

function toggleIndexGuideInfo() {
  if (!window.matchMedia('(max-width: 960px)').matches && (location.pathname.endsWith("/") || location.pathname.endsWith("/index.html"))) {
    if (!document.getElementById("idx_description_box")) {
      printIdxDescription();
    }
  } else {
    if (document.getElementById("idx_description_box")) document.getElementById("idx_description_box").remove();
  }
}

function toggleGoToTopByResizing() {
    if (location.pathname === "/") return;
    const $goToTopBox = document.getElementById("go-to-top-box");
    const $goToTop = document.getElementById("go-to-top");
    if (!$goToTopBox) return;
    const scrollHeight = document.documentElement.scrollHeight;
    const adjustedHeight = scrollHeight;
    const exceeds = adjustedHeight > (window.innerHeight + 10);
    $goToTop.textContent = localStorage.getItem("lang") === "ko" ? "위로 가기 ↑ " : "go to top ↑";
    $goToTopBox.style.display = exceeds ? "block" : "none";
}
