function loadScript(src, timeout = 5000) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        const timer = setTimeout(() => {
            script.remove();
            reject(new Error(`Script load timeout: ${src}`));
        }, timeout);

        script.src = src;
        script.async = true;

        script.onload = () => {
            clearTimeout(timer);
            resolve();
        };

        script.onerror = () => {
            clearTimeout(timer);
            script.remove();
            reject(new Error(`Script load failed: ${src}`));
        };

        document.head.appendChild(script);
    });
}

async function fetchAPI(url, options = {}, timeout = 5000) {
    const controller = new AbortController();

    const timer = setTimeout(() => {
        controller.abort();
    }, timeout);

    try {
        const response = await fetch(url, {
            ...options,
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error(
                `Fetch failed: ${response.status} ${response.statusText}`
            );
        }

        return response;
    } catch (error) {
        if (error.name === "AbortError") {
            throw new Error(`Fetch timeout: ${url}`);
        }

        throw error;
    } finally {
        clearTimeout(timer);
    }
}

function changeFontSize(delta) {
    const $idxContainer = document.getElementsByClassName("idx-container");
    const $pageContentWrapper = document.getElementById("page-content-wrapper");
    const $pageInfoTitle = document.getElementById("page-info-title");
    const root = document.documentElement;
    const mainContentP = getComputedStyle(root).getPropertyValue("--main-content-p");
    const currentFontSize = parseFloat(getComputedStyle($pageContentWrapper).fontSize);
    
    let newMainContentP = parseInt(mainContentP.slice(0, -2))+parseInt(delta);
    if (delta === 0) {
      newMainContentP = 24;
    }
    localStorage.setItem("content-line-height", newMainContentP);
    document.documentElement.style.setProperty("--main-content-p", newMainContentP+"px");

    let newFontSize = currentFontSize + delta;
    if (delta === 0) newFontSize = 16;

    localStorage.setItem("fontSize", newFontSize);
    $pageContentWrapper.style.fontSize = `${newFontSize}px`;
    if ($idxContainer) $idxContainer[0].style.fontSize = `${newFontSize}px`;
    if ($pageInfoTitle) $pageInfoTitle.style.fontSize = `${newFontSize}px`;
}

const autoIndexesMenu = ["projects", "code", "daily"];
function changeLang(lang) {
    if (lang === "en") {
        if (localStorage.getItem("lang") === "en") return;

        localStorage.setItem("lang", "en");
        localStorage.setItem("updateLang", "true");
        if (window.location.href === window.location.origin + "/") {
          location.reload();
          return;
        }

        originHref = window.location.href;
        if (autoIndexesMenu.some(menu => originHref.includes(menu)))  {
          const lastIdx = originHref.lastIndexOf("/");
          location.href = originHref.substring(0, lastIdx) + "/en/" + originHref.substring(lastIdx + 1);
        } else {
          location.reload();
        }
    } else {
      if (localStorage.getItem("lang") === "ko") return;

      localStorage.setItem("lang", "ko");
      localStorage.setItem("updateLang", "true");
      if (window.location.href === window.location.origin + "/") {
        location.reload();
        return;
      }

      originHref = window.location.href;
      if (autoIndexesMenu.some(menu => originHref.includes(menu))) {
        const lastIdx = originHref.lastIndexOf("/en/");
        if (lastIdx === -1) {
          location.reload();
        } else {
          location.href = originHref.substring(0, lastIdx) + "/" + originHref.substring(lastIdx + 4);
        }
      } else {
        location.reload();
      }
    }
}

async function search(searchQuery) {
    if (!searchQuery) searchQuery = document.getElementById("input_search").value.trim().toLowerCase();
    if (!searchQuery) return;

    try {
        const response = await fetch("/search.json");
        const textData = await response.text();
        const jsonData = JSON.parse(textData);
        printSearchResult(searchQuery, jsonData);
        const q = searchQuery;
        history.pushState(
            null,
            "",
            `/?search=${encodeURIComponent(q)}`
        );
    } catch (error) {
        printErrorResult();
    }

    toggleGoToTopByResizing();
}

function printSearchResult(searchQuery, posts) {
    const $pageContentWrapper = document.getElementById("page-content-wrapper");
    const $searchResultBox = document.getElementById("search-result-box");
    const $idxPathsBox = document.getElementById("idx-paths-box");
    const $pageInfoTitle = document.getElementById("page-info-title");
    const $pageInfoDate = document.getElementById("page-info-date");
    $pageContentWrapper.innerHTML = "";
    $searchResultBox.innerHTML = "";
    $searchResultBox.style.display="";
    $pageContentWrapper.appendChild($searchResultBox);

    if ($idxPathsBox) $idxPathsBox.innerHTML = "";
    if ($pageInfoTitle) $pageInfoTitle.innerHTML = "";
    if ($pageInfoDate) $pageInfoDate.innerHTML = "";

    const locale = localStorage.getItem("lang") === "ko" ? "ko-KR" : "en-US";
    const options = {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
        };

    const matchedPosts = posts
    .filter((post) => {
        if (post.title && post.title.toLowerCase() === "index" && post.tags.length == 0) return;

        const titleMatch = post.title ? post.title.toLowerCase().includes(searchQuery) : false;
        const contentMatch = post.content ? post.content.toLowerCase().includes(searchQuery) : false;
        const pagenameMatch = post.pagename ? post.pagename.toLowerCase().includes(searchQuery) : false;
        const pagenameKoMatch = post.pagenameKo ? post.pagenameKo.toLowerCase().includes(searchQuery) : false;
        const nomiationMatch = post.nomiation ? post.nomiation.toLowerCase().includes(searchQuery) : false;
        const addressMatch = post.address ? post.address.toLowerCase().includes(searchQuery) : false;
        const nomiationKoMatch = post.nomiationKo ? post.nomiationKo.toLowerCase().includes(searchQuery) : false;
        const addressKoMatch = post.addressKo ? post.addressKo.toLowerCase().includes(searchQuery) : false;
        const tagsMatch = post.tags ? post.tags.includes(searchQuery) : false;
        return titleMatch || contentMatch || pagenameMatch || pagenameKoMatch
            || nomiationMatch || addressMatch || nomiationKoMatch || addressKoMatch || tagsMatch;
    })
    .filter((post) => !post.url.includes("legacy"));

    if (matchedPosts.length === 0) {
        $searchResultBox.style.marginTop = "16px";
        $searchResultBox.textContent = localStorage.getItem("lang") === "ko" ? "검색 결과가 없습니다" : "No search results";
        return;
    } else {
      $searchResultBox.style.marginTop = "0px";
    }

    const orderedPosts = matchedPosts
            .filter((post) => !post.url.includes("legacy"))
            .sort((a, b) => {
                const aDate = a.createDate ? a.createDate : a.date;
                const bDate = b.createDate ? b.createDate : b.date;
                return new Date(bDate.replace(/-/g, '/')) - new Date(aDate.replace(/-/g, '/'));

function printPosts($searchResultBox, locale, options, posts, category, subcategory) {
  const $category = document.createElement("div");
  $category.style.marginTop = "12px";
  $category.classList = "post-list";
  const $categoryTextContent = document.createElement("span");
  if (subcategory) {
    $category.id = category + "-" + subcategory;
    $categoryTextContent.textContent = capitalize(localize(category) + " " + localize(subcategory));
  } else {
    $category.id = category;
    $categoryTextContent.textContent = capitalize(localize(category));
  }
  $categoryTextContent.style.fontWeight = 400;
  $category.appendChild($categoryTextContent);
  $searchResultBox.appendChild($category);

  const groupedPosts = Object.groupBy(posts, post => post["group"]);
  if (Object.keys(groupedPosts).length > 1) {
    const defaultGroup = groupedPosts["default"];
    if (defaultGroup) {
      const $group = document.createElement("div");
      const groupedPosts = organizeGroup(defaultGroup, $group, locale, options, true);
      $category.appendChild(groupedPosts);
    }
    delete groupedPosts["default"];

    for (const group of Object.keys(groupedPosts)) {
      const $group = document.createElement("div");
      const $groupName = document.createElement("div");

      $groupName.innerText = "- " + group;
      $groupName.classList.add("post-group-name");
      $group.appendChild($groupName);

      const subgroupedPosts = organizeGroup(groupedPosts[group], $group, locale, options);
      $category.appendChild(subgroupedPosts);
    }
  } else {
      for (const post of posts) {
        const $post = document.createElement("div");
        const postDate = post.createDate ? post.createDate : post.date;
        const formattedDate = new Date(postDate.replace(/-/g, '/')).toLocaleDateString(locale, options);
        const title = locale === "ko-KR" ? post.pagenameKo ? post.pagenameKo : post.pagename : post.pagename;
        const nonUndefinedTitle = title ? title : post.title;
        const capitalizedTitle = capitalize(nonUndefinedTitle);

        $post.innerHTML = `
            <span class='post-date'>${formattedDate}</span> <span class='post-link'><a href="${post.url}">${capitalizedTitle}</a></span>
        `;
        $category.appendChild($post);
      }
  }
}

function organizeGroup(groupedPosts, $group, locale, options, defaultGroup) {
  const subGroupedPosts = Object.groupBy(groupedPosts, post => post["subgroup"]);
  
  let subGroupCount = 1;
  for (const indexKey of Object.keys(subGroupedPosts)) {
    const $subGroup = document.createElement("div");
    if (subGroupCount > 1) $subGroup.classList.add("post-subgroup");
    for (const post of subGroupedPosts[indexKey]) {
      let $post;
      if (defaultGroup) {
        $post = document.createElement("div");
        $post.style.marginBottom = "4px";
      } else {
        $post = document.createElement("p");
      }
      const postDate = post.createDate ? post.createDate : post.date;
      const formattedDate = new Date(postDate.replace(/-/g, '/')).toLocaleDateString(locale, options);
      const title = locale === "ko-KR" ? post.pagenameKo ? post.pagenameKo : post.pagename : post.pagename;
      const nonUndefinedTitle = title ? title : post.title;
      const capitalizedTitle = capitalize(nonUndefinedTitle);
      $post.innerHTML = `<span class='post-date'>${formattedDate}</span> <span class='post-link'><a href="${post.url}">${capitalizedTitle}</a></span>`;
      $subGroup.appendChild($post);
    }
    $group.appendChild($subGroup);
    subGroupCount++;
  }

  return $group;
}

function toggleGoToTopByResizing() {
    const $goToTopBox = document.getElementById("go-to-top-box");
    if (!$goToTopBox) return;
    const scrollHeight = document.documentElement.scrollHeight;
    const adjustedHeight = scrollHeight;
    const exceeds = adjustedHeight > (window.innerHeight + 10);
    $goToTopBox.style.display = exceeds ? "flex" : "none";
}

function localize(category) {
    if (localStorage.getItem("lang") !== "ko") return category;

    let localized;
    switch(category) {
        case "projects":
        localized = "프로젝트";
        break;

        case "code":
        localized = "프로그래밍";
        break;

        case "daily":
        localized = "일상";
        break;

        case "archives":
        localized = "아카이브";
        break;

        case "sunrise":
        localized = "해맞이";
        break;

        default:
        localized = category;
    }

    return localized
}

function capitalize(str) {
  return str
    .split(" ")
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(" ");
}

document.addEventListener("DOMContentLoaded", () => {
    const $videos = document.querySelectorAll("video");
    $videos.forEach($video => {
        $video.playsInline = true;
    });

    const $imgs = document.querySelectorAll("img");
    $imgs.forEach($img => {
        $img.addEventListener("click", () => focusImg($img));
    });
});

function focusImg($img) {
    const $overlay = document.createElement("div");
    Object.assign($overlay.style, {
        position: "fixed",
        maxWidth: "100vw",
        maxHeight: "100vh",
        display: "flex",
        inset: "0",
        alignItems: "center",
        justifyContent: "center",
        background: "rgba(0,0,0,0.7)",
        backdropFilter: "blur(2px)",
        WebkitBackdropFilter: "blur(2px)",
        zIndex: "9999",
        cursor: "normal",
        overflow: "hidden",
        padding: window.innerWidth <= 960 ? "16px" : "40px",
        opacity: "0",
        transition: "opacity 250ms ease",
    });

    const $imgBox = document.createElement("div");
    Object.assign($imgBox.style, {
        width: "100%",
        height: "100%",
        display: "flex",
        alignItems: !($img.dataset.desc || $img.dataset.descKo) && window.innerWidth <= 960 ? "center" : window.innerWidth <= 960 ? "start" : "center",
        justifyContent: "center",
        overflow: "hidden",
    });

    const $focusedImg = $img.cloneNode(true);
    Object.assign($focusedImg.style, {
        width: "auto",
        height: "auto",
        maxWidth: ($img.dataset.desc || $img.dataset.descKo) ? window.innerWidth <= 960 ? "100%" : "65%" : "100%",
        maxHeight: "100%",
        objectFit: "contain",
        alignItems: "start",
        cursor: "normal",
        flexShrink: 0,
        opacity: "0",
        transform: "scale(0.92)",
        transition: "opacity 250ms ease, transform 250ms ease",
    });

    if (window.innerWidth <= 960) {
        $imgBox.style.flexDirection = "column";
        $imgBox.style.justifyContent = ($img.dataset.desc || $img.dataset.descKo) ? "start" : "center";

        $focusedImg.style.width = "auto";
        $focusedImg.style.height = "auto";
        $focusedImg.style.maxWidth = "100%";
        $focusedImg.style.maxHeight = "65%";
        $focusedImg.style.objectFit = "contain";
    }

    const $imgDescriptionBox = document.createElement("div");
    const imgDescFontSizeAdjust = window.innerWidth <= 960 ? 1 : 2;
    Object.assign($imgDescriptionBox.style, {
        display: "flex",
        flexDirection: "column",
        gap: "0.5em",
        overflowY: "auto",
        overflowX: "hidden",
        scrollbarWidth: "none",
        alignItems: "start",
        fontSize: localStorage.getItem("fontSize") ? parseInt(localStorage.getItem("fontSize")) + imgDescFontSizeAdjust + "px" : "18px",
        color: "#e3dfdf",
        opacity: "0",
        transform: window.innerWidth <= 960
            ? "translateY(0px)"
            : "translateX(0px)",
        transition: "opacity .3s ease, transform .3s cubic-bezier(.22,.61,.36,1)",
    });

    const style = document.createElement("style");
    style.textContent = `
        .img-desc-box::-webkit-scrollbar { display: none; width: 0; height: 0; }
    `;
    document.head.appendChild(style);
    $imgDescriptionBox.className = "img-desc-box";

    if (window.innerWidth <= 960) {
        Object.assign($imgDescriptionBox.style, {
            maxWidth: "98%",
            maxHeight: "100%",
            marginTop: "8px",
            paddingRight: "10px",
        });
    } else {
        Object.assign($imgDescriptionBox.style, {
            maxWidth: "35%",
            maxHeight: "100%",
            marginLeft: "30px",
            paddingRight: "10px",
        });
    }

    if ($img.dataset.desc || $img.dataset.descKo) {
        let descriptions;
        if (localStorage.getItem("lang") === "ko") {
            descriptions = ($img.dataset.descKo || $img.dataset.desc).split(" ");
        } else {
            descriptions = ($img.dataset.desc || $img.dataset.descKo).split(" ");
        }

        const nextLineIdxs = [];
        let index = descriptions.indexOf("\\n");

        while (index !== -1) {
            nextLineIdxs.push(index);
            index = descriptions.indexOf("\\n", index + 1);
        }

        if (nextLineIdxs.length === 0) {
            const $desc = document.createElement("div");
            descriptions.forEach(d => {
                $desc.textContent += (d + " ");
            });
            $imgDescriptionBox.appendChild($desc);
        } else {
            let start = 0;
            for (let i = 0; i < nextLineIdxs.length; i++) {
                const $desc = document.createElement("div");
                const idx = nextLineIdxs[i];
                const slices = descriptions.slice(start, idx);
                slices.forEach(s => {
                    $desc.textContent += (s + " ");
                });
                start = idx + 1;
                $imgDescriptionBox.appendChild($desc);
            }
            const slices = descriptions.slice(start);
            const $desc = document.createElement("div");
            slices.forEach(s => {
                $desc.textContent += (s + " ");
            });
            $imgDescriptionBox.appendChild($desc);
        }
    }

    function close() {
        $overlay.style.opacity = "0";

        $focusedImg.style.opacity = "0";
        $focusedImg.style.transform = "scale(.96)";

        $imgDescriptionBox.style.opacity = "0";
        $imgDescriptionBox.style.transform = window.innerWidth <= 960
            ? "translateY(0px)"
            : "translateX(0px)";

        setTimeout(() => {
            if ($overlay.parentNode) {
                $overlay.parentNode.removeChild($overlay);
            }
            document.body.style.overflow = "";
            document.removeEventListener("keydown", onKey);
        }, 300);
    }
    function onKey(e) {
        if (e.key === "Escape") close();
    }

    $focusedImg.addEventListener("click", close);
    $overlay.addEventListener("click", close);
    document.addEventListener("keydown", onKey);

    $imgBox.appendChild($focusedImg);
    $imgBox.appendChild($imgDescriptionBox);
    if (window.innerWidth > 960) {
        const setDescriptionHeight = () => {
            const imgHeight = $focusedImg.height;
            $imgDescriptionBox.style.height = `${imgHeight}px`;
        };
        if ($focusedImg.complete) {
            setDescriptionHeight();
        } else {
            $focusedImg.addEventListener("load", setDescriptionHeight, { once: true });
        }
    }
    $overlay.appendChild($imgBox);
    document.body.appendChild($overlay);
    requestAnimationFrame(() => {
        $overlay.style.opacity = "1";

        $focusedImg.style.opacity = "1";
        $focusedImg.style.transform = "scale(1)";

        setTimeout(() => {
            $imgDescriptionBox.style.opacity = "1";
            $imgDescriptionBox.style.transform = "translateX(0)";
            if (window.innerWidth <= 960) {
                $imgDescriptionBox.style.transform = "translateY(0)";
            }
        }, 40);
    });

    document.body.style.overflow = "hidden";
}

    const scrollHeight = document.documentElement.scrollHeight;
    const adjustedHeight = scrollHeight;
    const exceeds = adjustedHeight > (window.innerHeight + 100);
    const $goToTopBox = document.getElementById("go-to-top-box");
    if ($goToTopBox) {
      $goToTopBox.style.display = exceeds ? "flex" : "none";
    }
}
