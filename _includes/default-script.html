<script>
init();

function loadScript(src, timeout = 5000) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        const timer = setTimeout(() => {
            script.remove();
            reject(new Error(`Script load timeout: ${src}`));
        }, timeout);

        script.src = src;
        script.async = true;

        script.onload = () => {
            clearTimeout(timer);
            resolve();
        };

        script.onerror = () => {
            clearTimeout(timer);
            script.remove();
            reject(new Error(`Script load failed: ${src}`));
        };

        document.head.appendChild(script);
    });
}

async function init() {
    try {
        await loadScript(
            "https://cdn.jsdelivr.net/npm/ua-parser-js@2.0.10/dist/ua-parser.pack.min.js",
            5000
        );

        const parser = new UAParser();
        const result = parser.getResult();

        if (localStorage.getItem("lang") === "en") {
          document.getElementById("user_agent").innerText = "User-Agent: " + result.device.vendor + " " + result.os.name + ", " + result.browser.name;
        } else {
          const convertedResult = convertToKoreanUserAgent(result);
          document.getElementById("user_agent").innerText = "접속 환경: " + convertedResult.device.vendor + " " + convertedResult.os.name + ", " + convertedResult.browser.name
        }
    } catch (error) {
      if (localStorage.getItem("lang") === "en") {
        document.getElementById("user_agent").innerText = "User-Agent: Checking Failed";
      } else {
        document.getElementById("user_agent").innerText = "접속 환경: 알 수 없음";
      }
    }
}

    localStorage.setItem("lang", "ko");
} else if (!localStorage.getItem("lang")) {
    localStorage.setItem("lang", "en");
}

const today = new Date();
let blogInfoDateLocale = "en-US";
if (localStorage.getItem("lang") === "en") {
    printEnLang();
    document.getElementById("blog-search-btn").textContent = "Search";
    document.getElementById("user_agent").innerText = "User-Agent: Checking...";
    document.getElementById("user_layout").textContent = "Layout: Default";
    document.getElementById("user_font_size").textContent = "Font Size: ";
    document.getElementById("user_font_size_default").textContent = "Default";
    document.getElementById("user_font_size_smaller").textContent = "A-";
    document.getElementById("user_font_size_bigger").textContent = "A+";
    document.getElementById("user_appearance").textContent = "Appearance: ";
    document.getElementById("user_appearance_brightly").textContent = "Brightly";
    document.getElementById("user_appearance_darkly").textContent = "Darkly";
    document.getElementById("user_lang").textContent = "Locale: ";
    document.getElementById("footer").textContent = "Miscellaneous";
    document.getElementById("internet-usernames").textContent = "Internet: ";
    document.getElementById("github").textContent = "GitHub";
    document.getElementById("instagram").textContent = "Instagram";

    if (document.getElementById("not-found-text")) document.getElementById("not-found-text").textContent = "Cannot find the page.";
} else {
    printKoLang();
    document.getElementById("blog-search-btn").textContent = "검색";
    document.getElementById("user_agent").innerText = "접속 환경: 확인 중...";
    blogInfoDateLocale = 'ko-KR';
    document.getElementById("user_layout").textContent = "화면 구성: 기본";
    document.getElementById("user_font_size").textContent = "글꼴 크기: ";
    document.getElementById("user_font_size_default").textContent = "기본";
    document.getElementById("user_font_size_smaller").textContent = "가-";
    document.getElementById("user_font_size_bigger").textContent = "가+";
    document.getElementById("user_appearance").textContent = "배경: ";
    document.getElementById("user_appearance_brightly").textContent = "밝게";
    document.getElementById("user_appearance_darkly").textContent = "어둡게";
    document.getElementById("user_lang").textContent = "선호하는 언어: ";
    document.getElementById("footer").textContent = "정보";
    document.getElementById("internet-usernames").textContent = "인터넷: ";
    document.getElementById("github").textContent = "깃허브";
    document.getElementById("instagram").textContent = "인스타그램";
    document.getElementById("cosmos").textContent = "코스모스";
    if (document.getElementById("not-found")) document.getElementById("not-found").textContent = "404 Not Found";
    if (document.getElementById("not-found-text")) document.getElementById("not-found-text").textContent = "페이지를 찾을 수 없습니다.";
}
document.getElementById("user_visit_day").innerText = today.toLocaleDateString(blogInfoDateLocale, {
    year: 'numeric',
    month: 'long',
    day: 'numeric',
    weekday: 'long'
});

const fontSize = localStorage.getItem("fontSize");
if (fontSize && document.getElementById("page-content-wrapper")) document.getElementById("page-content-wrapper").style.fontSize = `${fontSize}px`;

function changeFontSize(delta) {
    const $pageContentWrapper = document.getElementById("page-content-wrapper");
    const currentFontSize = parseFloat(getComputedStyle($pageContentWrapper).fontSize);

    let newFontSize = currentFontSize + delta;
    if (delta === 0) newFontSize = 16;

    localStorage.setItem("fontSize", newFontSize);
    $pageContentWrapper.style.fontSize = `${newFontSize}px`;
}

localStorage.getItem("theme") !== undefined
    ? (localStorage.getItem("theme") === "dark") ? printDarklyAppearance() : printBrightlyAppearance()
    : (window.matchMedia("(prefers-color-scheme: dark)").matches) ? printDarklyAppearance() : printBrightlyAppearance();

const helloUserPreferTheme = window.matchMedia("(prefers-color-scheme: dark)");
helloUserPreferTheme.addEventListener?.("change", (e) => {
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    prefersDark ? printDarklyAppearance() : printBrightlyAppearance();
});

function printDarklyAppearance() {
    document.getElementById("user_appearance_darkly").classList.add("selected-highlight", "cursor-pointer");
    document.getElementById("user_appearance_brightly").classList = "cursor-pointer";
}

function printBrightlyAppearance() {
    document.getElementById("user_appearance_darkly").classList = "cursor-pointer";
    document.getElementById("user_appearance_brightly").classList.add("selected-highlight", "cursor-pointer");
}

function printEnLang() {
    document.getElementById("user_lang_en").classList.add("selected-highlight", "cursor-pointer");
    document.getElementById("user_lang_ko").classList = "cursor-pointer";
}

function printKoLang() {
    document.getElementById("user_lang_en").classList = "cursor-pointer";
    document.getElementById("user_lang_ko").classList.add("selected-highlight", "cursor-pointer");
}

function changeTheme(theme) {
    if (theme === "darkly") {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
    location.reload();
}

const autoIndexesMenu = ["projects", "code", "daily"];
function changeLang(lang) {
    if (lang === "en") {
        if (localStorage.getItem("lang") === "en") return;

        localStorage.setItem("lang", "en");
        if (window.location.href === window.location.origin + "/") {
          location.reload();
          return;
        }

        originHref = window.location.href;
        if (autoIndexesMenu.some(menu => originHref.includes(menu)))  {
          const lastIdx = originHref.lastIndexOf("/");
          location.href = originHref.substring(0, lastIdx) + "/en/" + originHref.substring(lastIdx + 1);
        } else {
          location.reload();
        }
    } else {
      if (localStorage.getItem("lang") === "ko") return;

      localStorage.setItem("lang", "ko");
      if (window.location.href === window.location.origin + "/") {
        location.reload();
        return;
      }

      originHref = window.location.href;
      if (autoIndexesMenu.some(menu => originHref.includes(menu))) {
        const lastIdx = originHref.lastIndexOf("/en/");
        if (lastIdx === -1) {
          location.reload();
        } else {
          location.href = originHref.substring(0, lastIdx) + "/" + originHref.substring(lastIdx + 4);
        }
      } else {
        location.reload();
      }
    }
}

const $empty = document.getElementById("empty");
const $pageContentWrapper = document.getElementById("page-content-wrapper");
if ($empty) {
    $empty.textContent = localStorage.getItem("lang") === "ko" ? "빈 페이지" : "Empty Page";
} else if (window.location.pathname !== "/" && $pageContentWrapper && $pageContentWrapper.childElementCount === 0) {
    const $span = document.createElement("div");
    $span.style.marginBottom = "3px";
    $span.textContent = localStorage.getItem("lang") === "ko" ? "빈 페이지" : "Empty Page";
    $pageContentWrapper.innerHTML = "";
    $pageContentWrapper.appendChild($span);
}

const hyperlinks = Array.from(document.getElementsByTagName("a"));
hyperlinks.forEach((link) => {
    if (localStorage.getItem("lang") === "ko") {
        if (link.dataset.displayKo) {
            link.textContent = link.dataset.displayKo;
        }
        if (link.dataset.hrefKo) {
            link.href = link.dataset.hrefKo;
        }
    } else if (link.dataset.display){
        link.textContent = link.dataset.display;
    } else {
        link.textContent = link.textContent;
    }
});

function convertToKoreanUserAgent(userAgent) {
    let vendor, os, browser;
    let deviceType = "";

    if (!userAgent.device || !userAgent.device.vendor || !userAgent.os || !userAgent.os.name || !userAgent.browser || !userAgent.browser.name) {
      return userAgent;
    }

    vendor = userAgent.device.vendor.toLocaleLowerCase();
    os = userAgent.os.name.toLocaleLowerCase();
    browser = userAgent.browser.name.toLocaleLowerCase();

    if (userAgent.device.type) {
      deviceType = userAgent.device.type.toLocaleLowerCase();
    }

    const koreanUserAgent = {
      device: {
        vendor: vendor,
      },
      os : {
        name: os,
      },
      browser: {
        name: browser,
      },
    }

    switch (vendor) {
      case "apple":
        koreanUserAgent.device.vendor = "애플";
        break;
      case "google":
        koreanUserAgent.device.vendor = "구글";
        break;
      case "samsung":
        koreanUserAgent.device.vendor = "삼성";
        break;
      case "facebook":
        koreanUserAgent.device.vendor = "페이스북";
        break;
      case "amazon":
        koreanUserAgent.device.vendor = "아마존";
        break;
      case "dell":
        koreanUserAgent.device.vendor = "델";
        break;
      case "lenovo":
        koreanUserAgent.device.vendor = "레노보";
        break;
      case "lg":
        koreanUserAgent.device.vendor = "LG";
        break;
      case "nintendo":
        koreanUserAgent.device.vendor = "닌텐도";
        break;
      case "panasonic":
        koreanUserAgent.device.vendor = "파나소닉";
        break;
      case "tesla":
        koreanUserAgent.device.vendor = "테슬라";
        break;
      case "xbox":
        koreanUserAgent.device.vendor = "엑스박스";
        break;
      case "asus":
        koreanUserAgent.device.vendor = "에이수스";
        break;
      case "microsoft":
        koreanUserAgent.device.vendor = "마이크로소프트";
        break;
      default:
        koreanUserAgent.device.vendor = vendor;
        break;
    }

    switch (os) {
      case "macos":
        koreanUserAgent.os.name = "맥";
        break;
      case "ios":
        koreanUserAgent.os.name = "아이폰";
        break;
      case "ipad":
        koreanUserAgent.os.name = "아이패드";
        break;
      case "windows":
      case "windows rt":
      case "windowsrt":
      case "windows mobile":
        koreanUserAgent.os.name = "윈도우";
        break;
      case "android":
        koreanUserAgent.os.name = "안드로이드";
        break;
      case "chrome os":
      case "chromeos":
      case "chromecast android":
      case "chromecast fuchsia":
      case "chromecast linux":
        koreanUserAgent.os.name = "크롬OS";
        break;
      case "linux":
      case "centos":
      case "debian":
      case "ubuntu":
      case "fedora":
      case "suse":
      case "opensuse":
      case "gentoo":
      case "manjaro":
      case "mint":
      case "minix":
        koreanUserAgent.os.name = "리눅스";
        break;
      default:
        koreanUserAgent.os.name = os;
    }

    if (deviceType === "tablet") {
      switch (vendor) {
        case "apple":
          koreanUserAgent.os.name = "아이패드";
          break;
        case "samsung":
          koreanUserAgent.os.name = "갤럭시 탭";
          break;
        case "google":
          koreanUserAgent.os.name = "구글 태블릿";
          break;
        case "microsoft":
          koreanUserAgent.os.name = "윈도우 태블릿";
          break;
        default:
          koreanUserAgent.device.type = "태블릿";
          break;
      }
    }

    switch (browser) {
      case "chrome":
      case "chromium webview":
      case "chromium":
      case "mobile chrome":
        koreanUserAgent.browser.name = "크롬";
        break;
      case "firefox":
      case "firefox focus":
      case "firefox reality":
      case "mobile firefox":
        koreanUserAgent.browser.name = "파이어폭스";
        break;
      case "safari":
      case "mobile safari":
        koreanUserAgent.browser.name = "사파리";
        break;
      case "edge":
      case "edge webview":
      case "edge webview2":
        koreanUserAgent.browser.name = "엣지";
        break;
      case "opera":
      case "opera coast":
      case "opera gx":
      case "opera mobi":
      case "opera neon":
      case "opera tablet":
      case "opera touch":
        koreanUserAgent.browser.name = "오페라";
        break;
      case "whale":
      case "naver":
        koreanUserAgent.browser.name = "네이버 웨일";
        break;
      case "electron":
        koreanUserAgent.browser.name = "일렉트론";
        break;
      case "brave":
        koreanUserAgent.browser.name = "브레이브";
        break;
      case "atlas":
        koreanUserAgent.browser.name = "아틀라스";
        break;
      case "samsung internet":
        koreanUserAgent.browser.name = "삼성 인터넷";
        break;
      case "android browser":
        koreanUserAgent.browser.name = "안드로이드 브라우저";
        break;
      case "duckduckgo":
        koreanUserAgent.browser.name = "덕덕고";
        break;
      case "facebook":
        koreanUserAgent.browser.name = "페이스북";
        break;
      case "kakaotalk":
        koreanUserAgent.browser.name = "카카오톡";
        break;
      case "line":
        koreanUserAgent.browser.name = "라인";
        break;
      case "linkedin":
        koreanUserAgent.browser.name = "링크드인";
        break;
      case "tesla":
        koreanUserAgent.browser.name = "테슬라 브라우저";
        break;
      case "tiktok":
        koreanUserAgent.browser.name = "틱톡";
        break;
      case "vivaldi":
        koreanUserAgent.browser.name = "비발디";
        break;
      case "yandex":
        koreanUserAgent.browser.name = "얀덱스";
        break;
      default:
        koreanUserAgent.browser.name = browser;
        break;
    }

    return koreanUserAgent;
}

</script>
