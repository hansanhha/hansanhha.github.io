<link rel="stylesheet" href="/assets/lang.css">

<meta createDate="{{ page.createDate}}">
<meta updateDate="{{ page.updateDate}}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-page-name="{{ page.page-name }}" data-page-name-ko="{{ page.page-name-ko }}" data-page-title="{{ page.title }}">
    {% if page.dir == "/" %}
      한산하 HANSANHHA
    {% elsif page.page-name != nil and page.page-name-ko != nil %}
        {{ page.page-name-ko }}, {{ page.page-name }} | HANSANHHA
    {% elsif page.page-name-ko != nil %}
        {{ page.page-name-ko }} | HANSANHHA
    {% elsif page.page-name != nil %}
        {{ page.page-name }} | HANSANHHA
    {% elsif page.title != nil %}
        {{ page.title }} | HANSANHHA
    {% else %}
      {{ site.title }}
    {% endif %}
</title>
<link rel="alternate" type="application/rss+xml" href="{{ site.url }}/feed.xml" title="{{ site.title }} Feed">
{% seo %}
