<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
    {% if page.dir == "/" %}
      {{ site.title }}
    {% elsif page.title %}
        {% if page.title == "Index" %}
            {{ site.title }} - {{ page.collection }}
        {% else %}
            {{ site.title }} - {{ page.title }}
        {% endif %}
    {% else %}
      {{ site.title }}
    {% endif %}
</title>
