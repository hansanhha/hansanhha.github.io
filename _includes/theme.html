<script>
if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
    if (localStorage.getItem("theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
    } else {
        document.documentElement.setAttribute("data-theme", "dark");
    }
} else {
    if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
    } else {
        document.documentElement.setAttribute("data-theme", "light");
    }
}

const userPreferTheme = window.matchMedia("(prefers-color-scheme: dark)");
userPreferTheme.addEventListener?.("change", (e) => {
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const $root = document.documentElement;
    const $theme = document.getElementById("toggle_theme");

    if (prefersDark) {
        localStorage.setItem("theme", "dark");
        $root.setAttribute("data-theme", "dark");

        if (localStorage.getItem("lang") === "ko") {
            $theme.textContent = "밝게";
        } else {
            $theme.textContent = "brightly";
        }
        return;
    }

    localStorage.setItem("theme", "light");
    $root.setAttribute("data-theme", "light");
    if (localStorage.getItem("lang") === "ko") {
        $theme.textContent = "어둡게";
    } else {
        $theme.textContent = "darkly";
    }
});
</script>
